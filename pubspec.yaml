name: hydrotracker
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.8.0
  firebase_database: ^12.4.0
  firebase_auth: ^6.5.0
  flutter_riverpod: ^3.3.1
  # Removed standalone `riverpod` as it is exported by `flutter_riverpod`
  nfc_manager: ^4.2.1
  flutter_nfc_kit: ^3.6.2
  fl_chart: ^1.2.0
  intl: ^0.20.2
  connectivity_plus: ^6.0.5
  google_fonts: ^6.2.1
  google_sign_in: ^6.2.2
  flutter_facebook_auth: ^7.1.1
  dio: ^5.4.0
  retrofit: ^4.9.0 # Bumped to align with newer generator
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  freezed: ^3.2.5
  retrofit_generator: ^10.2.1 # Upgraded to support Dart 3.8+ analyzer APIs
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true