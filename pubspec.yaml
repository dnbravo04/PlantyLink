name: hydrotracker
description: "PlantyLink — Monitoreo inteligente de sistemas hidropónicos."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.8.0
  firebase_database: ^12.4.0
  firebase_auth: ^6.5.0
  firebase_messaging: ^16.2.1
  flutter_local_notifications: ^18.0.1
  flutter_riverpod: ^3.3.1
  # Removed standalone `riverpod` as it is exported by `flutter_riverpod`
  nfc_manager: ^4.2.1
  fl_chart: ^1.2.0
  intl: ^0.20.2
  connectivity_plus: ^6.0.5
  google_fonts: ^6.2.1
  google_sign_in: ^6.2.2
  mobile_scanner: ^6.0.2
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  dio: ^5.4.0
  retrofit: ^4.9.0 # Bumped to align with newer generator
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  freezed: ^3.2.5
  retrofit_generator: ^10.2.1 # Upgraded to support Dart 3.8+ analyzer APIs
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true